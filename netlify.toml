[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Same-origin /api proxy to the production backend on Render.
[[redirects]]
  from = "/api/*"
  to = "https://sakina-api-po5b.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
